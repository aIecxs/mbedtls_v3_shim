name: Build Arduino library ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arduino library
        run: |
          destdir="site/package/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$destdir"

          # Copy the repository to a temporary build directory.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='CMakeLists.txt' \
            --exclude='site/' \
            ./ "$destdir/"

          # Move include/* into src/*.
          cp -a "$destdir/include/." "$destdir/src/"

          # Remove the original include directory.
          find "$destdir/include" -delete

          # update version
          version=$(sed -n '/^version:[[:space:]]*"/{s/^version:[[:space:]]*"\([^"]*\)".*$/\1/p;q;}' "$destdir/idf_component.yml")
          rm "$destdir/idf_component.yml"

          # dummy header
          [ -f "$destdir/src/mbedtls_v3_shim.h" ] || \
          printf '%s\n' '#pragma once' > "$destdir/src/mbedtls_v3_shim.h"

          # arduino info
          [ -f "$destdir/library.properties" ] || \
          printf '%s\n' \
          'name=mbedtls_v3_shim' \
          "version=$version" \
          'author=David Cermak' \
          'maintainer=David Cermak' \
          'sentence=mbedTLS v3 compatibility shim for ESP-IDF v6+ (mbedTLS v4 / PSA)' \
          'paragraph=Allows legacy code written for mbedTLS v3 to compile against mbedTLS v4 on Arduino Core v4.x' \
          'category=Other' \
          'url=https://github.com/david-cermak/mbedtls_v3_shim' \
          'architectures=esp32' \
          'includes=mbedtls_v3_shim.h' \
          > "$destdir/library.properties"

          # Create the ZIP.
          cd site/package
          zip -r "../${destdir##*/}.zip" "${destdir##*/}"
          cd -

          # Remove the temporary extracted tree.
          find "$destdir" -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4