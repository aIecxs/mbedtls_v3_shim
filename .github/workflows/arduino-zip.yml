name: Build Arduino library ZIP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Arduino library
        run: |
          destdir="site/package/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$destdir"

          # Copy the repository to a temporary build directory.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ "$destdir/"

          # Move include/* into src/*.
          cp -a "$destdir/include/." "$destdir/src/"

          # Remove the original include directory.
          find "$destdir/include" -delete

          # Create the ZIP.
          cd site/package
          zip -r "../${destdir##*/}.zip" "${destdir##*/}"
          cd -

          # Remove the temporary extracted tree.
          find "$destdir" -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4